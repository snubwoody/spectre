name: Linux x86_64
on:
  push: 
    branches: ["main"]
  pull_request: 
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all crates
        run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build utils
        run: cargo build -p spectre-cli --release

      - name: Download chrome
        run: target/release/spectre-cli download chrome

      - name: Test
        run: cargo test --no-fail-fast
        
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    env:
      SPECTRE_PORT: 2000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{runner.os}}-cargo-${{hashFiles('**/Cargo.lock')}}

      - name: Cargo fmt
        run: cargo fmt --check
  clippy:
    name: Linting
    runs-on: ubuntu-latest
    env:
      SPECTRE_PORT: 2000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{runner.os}}-cargo-${{hashFiles('**/Cargo.lock')}}

      - name: Clippy
        run: cargo clippy -- -D warnings
