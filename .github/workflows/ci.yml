name: Testing
on:
  push: 
    branches: ["main"]
  pull_request: 
    branches: ["main"]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deno
        uses: denoland/setup-deno@v2
        with: 
          deno-version: 'v2.x'
      
      - name: Test
        run: deno test -A
