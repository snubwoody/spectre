[workspace]
resolver = "3"
members = [ 
	"spectre-cli",
	"spectre-core", 
	"spectre-macros", 
	"spectre"
]

[workspace.dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tokio-tungstenite = "0.26.2"
zip = "2.6.1"
rand = "0.9.1"
log = "0.4.27"

